<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b09"><meta name="description" content="Welcome to PricePal. Launch the live price comparison app.">
  <title>PricePal</title><link rel="icon" href="/static/pricepal-app-icon.png?v=2" type="image/png">
  <style>
    :root{color-scheme:dark;--bg:#080b09;--panel:#0e1510;--line:#26362b;--text:#f1f5f1;--muted:#a0aca2;--green:#8bcf96}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 40%,#142219 0,#0a100c 42%,var(--bg) 78%);color:var(--text);font:15px/1.5 'DM Sans',Arial,sans-serif;display:grid;place-items:center;padding:28px}.welcome{width:min(100%,620px);min-height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:54px 28px;border:1px solid #26362bb8;border-radius:28px;background:linear-gradient(145deg,#111a14e8,#0b100def);box-shadow:0 30px 100px #0008}.logo{display:block;width:min(100%,400px);height:auto;object-fit:contain;margin:0 auto 34px}.welcome h1{font-size:clamp(25px,5vw,38px);letter-spacing:-1.5px;line-height:1.12;margin:0 0 12px;font-weight:750}.welcome p{margin:0 0 30px;color:var(--muted);max-width:360px}.launch{display:inline-flex;align-items:center;justify-content:center;gap:20px;min-width:190px;min-height:54px;padding:0 25px;border:1px solid #8bcf9680;border-radius:12px;background:linear-gradient(135deg,#316b3c,#254f30);color:#f4fbf4;text-decoration:none;font-weight:750;box-shadow:0 10px 35px #4a9d5925;transition:transform .18s,filter .18s}.launch:hover{transform:translateY(-2px);filter:brightness(1.15)}.launch span{font-size:21px}.maker{position:absolute;bottom:24px;left:0;right:0;text-align:center}.maker a{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 15px;border:1px solid #436d4b;border-radius:9px;background:#142219;color:var(--green);font-size:12px;font-weight:700;text-decoration:none;transition:background .16s,border-color .16s}.maker a:hover{background:#1b3020;border-color:#6faf7b;text-decoration:none}@media(max-width:520px){body{padding:14px}.welcome{min-height:440px;padding:35px 20px;border-radius:20px}.logo{width:min(100%,330px);margin-bottom:28px}}
  </style>
</head>
<body>
  <main class="welcome">
    <img class="logo" src="/static/pricepal-logo.png?v=1" alt="PricePal">
    <a class="launch" href="/app">Launch App <span aria-hidden="true">→</span></a>
  </main>
  <footer class="maker"><a href="https://www.kelixel.com/" target="_blank" rel="noopener noreferrer">Made by KeliXel ↗</a></footer>
</body>
</html>
