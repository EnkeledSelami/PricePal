services:
  - type: web
    name: pricepal-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    disk:
      name: pricepal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PRICEPAL_DB
        value: /var/data/pricepal-web.sqlite3
      - key: PRICEPAL_SECRET_KEY
        generateValue: true
      - key: PRICEPAL_ALLOWED_ORIGINS
        value: https://kelixel.com,https://www.kelixel.com
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: None
